name: CI — Compteur Ciment

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend : linting + tests ────────────────────────────────────────────────
  backend-test:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps (OpenCV + pyzbar + tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libzbar0 tesseract-ocr tesseract-ocr-fra

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff --quiet
          ruff check app/ tests/ --output-format=github

      - name: Run tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "ci_test_secret_key_at_least_32_chars_long"
          ALLOWED_ORIGINS: "http://localhost:3000"
          PYTHONPATH: "${{ github.workspace }}/backend"
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  # ── Frontend : build React ───────────────────────────────────────────────────
  frontend-build:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm via corepack
        run: corepack enable && corepack prepare pnpm@10.4.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: ""
        run: pnpm exec vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist/
          retention-days: 7

  # ── Docker : validation des Dockerfiles ────────────────────────────────────
  docker-validate:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend Dockerfile (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ciment-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate frontend Dockerfile (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          tags: ciment-frontend:ci
          build-args: |
            VITE_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Résumé du pipeline ───────────────────────────────────────────────────────
  ci-success:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "Backend tests failed" && exit 1
          fi
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "Frontend build failed" && exit 1
          fi
          echo "All CI checks passed!"
